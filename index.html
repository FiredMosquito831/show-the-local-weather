<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Show the Local Weather</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app" style="background:#8ea9b8">
    <h1>Local Weather</h1>

    <section class="controls">
      <form id="location-form" autocomplete="off">
        <input
          id="location-input"
          type="text"
          placeholder="Search a city, e.g. Tokyo"
          aria-label="City to look up"
        />
        <button type="submit" id="search-btn">Search</button>
      </form>
      <button id="unit-toggle" type="button" aria-pressed="false">
        &deg;F &harr; &deg;C
      </button>
    </section>

    <section class="current" aria-live="polite">
      <div class="loc">
        <span class="name" id="loc-name">Finding your location&hellip;</span>
        <span class="status" id="status-note"></span>
      </div>
      <div class="hero">
        <span class="icon" id="wx-icon" aria-hidden="true">&#127777;</span>
        <span class="temp" id="wx-temp">--&deg;</span>
      </div>
      <p class="desc" id="wx-desc">&mdash;</p>
      <p class="meta" id="wx-meta"></p>
    </section>

    <section class="forecast" aria-label="3-day forecast">
      <h2>Forecast</h2>
      <ul id="forecast-list"></ul>
    </section>

    <footer class="foot">
      <span id="foot-note">Data by Open-Meteo.</span>
    </footer>
  </main>

  <script src="logic.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
